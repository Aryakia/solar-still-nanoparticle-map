name: One-time basemap repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-basemap.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace deprecated CARTO tiles with OpenStreetMap
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          old = "const baseLight = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { subdomains:'abcd', maxZoom:19, attribution:'&copy; OpenStreetMap contributors &copy; CARTO' }).addTo(map);"
          new = "const baseLight = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors' }).addTo(map);"

          if old not in html:
              raise SystemExit('Expected CARTO basemap declaration was not found; refusing to modify the file.')

          html = html.replace(old, new, 1)

          css_anchor = "    .leaflet-control-layers, .leaflet-bar { border-radius:10px; overflow:hidden; box-shadow:var(--shadow); }"
          css_replacement = css_anchor + "\n    .leaflet-tile-pane { filter:grayscale(88%) saturate(55%) brightness(1.06); }"
          if css_anchor in html and '.leaflet-tile-pane {' not in html:
              html = html.replace(css_anchor, css_replacement, 1)

          path.write_text(html, encoding='utf-8')

      - name: Commit repaired map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Fix map basemap API-key watermark"
          git push
